<script>/* view: funnel.js */
// live-panel view: funnel — pipeline / conversion chart
// Self-registers via LP.registerView. Contract and config keys: references/views.md.
(function(){
  var NS = 'http://www.w3.org/2000/svg';

  function svg(ctx, tag, attrs){
    var n = document.createElementNS(NS, tag);
    if(attrs){
      Object.keys(attrs).forEach(function(k){ n.setAttribute(k, attrs[k]); });
    }
    return n;
  }

  function el(tag, cls, style){
    var n = document.createElement(tag||'div');
    if(cls) n.className = cls;
    if(style) n.style.cssText = style;
    return n;
  }

  function fmtNum(v){
    // compact for population-scale numbers: 8B, 1.5B, 20M; commas below a million
    // thresholds sit where the rounded value reaches the next unit (999,960,000 -> 1B, not 1000M)
    var a = Math.abs(v);
    if(a >= 9.9995e8) return String(Math.round(v/1e8)/10) + 'B';
    if(a >= 999999.5) return String(Math.round(v/1e5)/10) + 'M';
    var s = String(Math.round(v));
    return s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function fmtPct(p){
    // String() switches to exponent notation below 1e-6 (8B -> 5 is 6.3e-8 %)
    var s = String(p);
    return s.indexOf('e') < 0 ? s : p.toFixed(1 - Math.floor(Math.log10(p)));
  }

  LP.registerView('funnel', {
    build: function(ctx){
      var e = ctx.e, rect = ctx.rect, root = ctx.root;
      var w = rect.w, h = rect.h;
      var dark = ctx.dark;
      var u = Math.min(w, h)/100;
      var stages = (e.stages||[]).map(function(s,i){ return {label:s.label,sub:s.sub||'',value:Number(s.value)||0,i:i}; });
      var n = stages.length;

      // ---- title block (drawn inside root) ----
      var topPad = Math.round(u*2), botPad = Math.round(u*1.5);
      var titleH = topPad, subH = 0;
      if(e.title){
        var titleSize = Math.max(22, Math.min(u*3.2, 46));
        var titleLh = Math.round(titleSize*1.25);
        var titleEl = el('div', null,
          'position:absolute;left:0;right:0;top:'+topPad+'px;height:'+titleLh+'px;line-height:'+titleLh+'px;text-align:center;font-family:var(--font-title);font-size:'+titleSize+'px;font-weight:700;color:'+ctx.cc('fg')+';white-space:pre;');
        titleEl.textContent = e.title;
        ctx.mark(titleEl,'text');
        root.appendChild(titleEl);
        titleH += titleLh;
      }
      if(e.subtitle){
        var subSize = Math.max(13, Math.min(u*1.6, 19));
        var subLh = Math.round(subSize*1.4);
        var subEl = el('div', null,
          'position:absolute;left:0;right:0;top:'+titleH+'px;height:'+subLh+'px;line-height:'+subLh+'px;text-align:center;font-size:'+subSize+'px;color:'+ctx.cc('muted')+';white-space:pre;letter-spacing:0.5px;');
        subEl.textContent = e.subtitle;
        ctx.mark(subEl,'text');
        root.appendChild(subEl);
        subH = subLh;
      }

      var headH = titleH + subH + Math.round(u*1.6);

      // ---- layout ----
      var marginX = Math.round(u*5);
      var bodyTop = headH;
      var bodyH = h - headH - botPad;
      var bodyW = w - marginX*2;
      var cy = bodyTop + bodyH/2;

      // vertical span per stage
      var convPillH0 = Math.round(u*2.8);
      var stageGap = convPillH0 + 8; // the conversion pill sits fully inside the gap
      var stageH = Math.max(22, Math.round((bodyH - stageGap*(n-1))/n));
      // vertical centers of each stage
      var stageCy = stages.map(function(_,i){ return bodyTop + stageH/2 + i*(stageH+stageGap); });

      // widths proportional to max value
      var vmax = (stages[0]&&stages[0].value>0)?stages[0].value:1;   // all-zero funnel: no NaN geometry
      var minFrac = 0.28; // minimum readable width (relative to bodyW)
      var maxBarW = bodyW*0.68;
      var labelW = Math.round(bodyW*0.18);
      var valW = Math.round(bodyW*0.12);

      var logScale = e.scale === 'log';
      // log stages stay wide near the top, so keep the bar clear of the label and value columns
      if(logScale) maxBarW = bodyW - 2*Math.max(labelW, valW) - 4*u;
      var vminPos = stages.reduce(function(m,s){ return s.value>0 ? Math.min(m,s.value) : m; }, vmax);
      function barW(v){
        if(logScale && vmax > vminPos){
          // log width for data spanning orders of magnitude (people, tokens): the smallest stage sits at the floor
          var f = v>0 ? (Math.log(v)-Math.log(vminPos))/(Math.log(vmax)-Math.log(vminPos)) : 0;
          return Math.round(maxBarW*(0.14 + 0.86*Math.max(0,f)));
        }
        // honest linear width; a floor only for stages below 14% of the top
        return Math.round(Math.max(maxBarW*0.14, maxBarW*v/vmax));
      }
      // palette: default one accent per stage; "mono" = one quiet accent, the focus stage (default last) in a hot accent
      var mono = e.palette === 'mono';
      var focusI = (typeof e.focus === 'number') ? e.focus : n-1;
      // the focus accent must stand apart from acc1 in both themes; dark acc2 is a blue next to cyan acc1
      var hot = dark ? 6 : 2;
      function stAcc(i){ return mono ? (i===focusI ? 'acc'+hot : 'acc1') : ctx.acc(i); }
      function stAccf(i){ return mono ? (i===focusI ? 'accf'+hot : 'accf1') : ctx.accf(i); }

      // centre X of funnel
      var cx = w/2;

      // ---- SVG layer for shapes / particles ----
      var svgEl = svg(ctx, 'svg', {width:w, height:h});
      svgEl.style.cssText = 'position:absolute;left:0;top:0;overflow:visible;pointer-events:none;';
      root.appendChild(svgEl);

      // ---- build each stage ----
      var state = {n:n, period:e.period||18};

      // Glow filter for dark mode (thin, crisp)
      var defs = svg(ctx,'defs',{});
      var glowId = 'fl-glow';
      var fltr = svg(ctx,'filter',{id:glowId,x:'-50%',y:'-50%',width:'200%',height:'200%'});
      var fga = svg(ctx,'feGaussianBlur',{stdDeviation:dark?'2.4':'1.4',result:'b'});
      var fmr = svg(ctx,'feMerge',{});
      var mn1 = svg(ctx,'feMergeNode',{'in':'b'});
      var mn2 = svg(ctx,'feMergeNode',{'in':'SourceGraphic'});
      fmr.appendChild(mn1); fmr.appendChild(mn2);
      fltr.appendChild(fga); fltr.appendChild(fmr);
      defs.appendChild(fltr);
      svgEl.appendChild(defs);

      // Trapezoid group (per stage): two widths = barW(v_above) top, barW(v) bottom
      // Except first: top = barW(v0), bottom = barW(v1) at transition;
      // we draw each stage as a trapezoid with top width and bottom width based on own value and next value.
      // Simpler: each stage i drawn as a trapezoid with
      //   topW = barW(stages[i].value), bottomW = barW(i<n-1? stages[i+1].value : stages[i].value*0.98)
      // Then small separator gap.
      stages.forEach(function(s,i){
        var yTop = stageCy[i] - stageH/2;
        var yBot = stageCy[i] + stageH/2;
        var tw = barW(s.value);
        var bw = (i<n-1)? barW(stages[i+1].value) : Math.round(tw*0.92);
        var pts = [
          [cx - tw/2, yTop],
          [cx + tw/2, yTop],
          [cx + bw/2, yBot],
          [cx - bw/2, yBot]
        ];
        var acc = stAcc(i);
        var accf = stAccf(i);
        var poly = svg(ctx,'polygon',{
          points: pts.map(function(p){return p[0]+','+p[1]}).join(' '),
          fill: ctx.cc(accf),
          stroke: ctx.cc(acc),
          'stroke-width': dark?'1.2':'1.5',
          'stroke-linejoin':'round'
        });
        ctx.mark(poly, 'box');
        svgEl.appendChild(poly);
      });

      // Connectors (subtle vertical lines between stages, routed around trapezoid sides)
      // Using a subtle dotted guide for each inter-stage gap on left/right edges
      for(var i=0;i<n-1;i++){
        var ln = svg(ctx,'line',{
          x1:cx, y1:stageCy[i] + stageH/2, x2:cx, y2:stageCy[i+1] - stageH/2,
          stroke: ctx.cc('grid'), 'stroke-width':'1', 'stroke-dasharray':'2 3'
        });
        ctx.mark(ln,'edge');
        svgEl.appendChild(ln);
      }

      // Labels (HTML for reliable CJK rendering)
      var ls = Number(e.labelScale)||1;
      var labelSize = Math.max(12, Math.min(u*1.55*ls, 17*ls));
      var labelLh = Math.round(labelSize*1.55);
      var subSize = Math.max(11, Math.round(labelSize*0.82));
      var subLh = Math.round(subSize*1.55);

      var vs = Number(e.valueScale)||1;
      var valSize = Math.max(14, Math.min(u*2.0*vs, 22*vs));
      var valLh = Math.round(valSize*1.3);

      stages.forEach(function(s,i){
        var yTop = stageCy[i] - stageH/2;
        // label (left-aligned, to the left of bar area)
        var labelX = marginX;
        var labelBox = el('div', null,
          'position:absolute;left:'+labelX+'px;top:'+Math.round(yTop + (stageH - labelLh - subLh)/2)+'px;width:'+labelW+'px;white-space:pre;');
        var l1 = el('div', null, 'height:'+labelLh+'px;line-height:'+labelLh+'px;font-size:'+labelSize+'px;color:'+ctx.cc('fg')+';font-weight:600;overflow:hidden;text-overflow:ellipsis;');
        var fit1 = ctx.fit(s.label, labelSize, labelW-4, null, 11, true);
        l1.style.fontSize = fit1.size+'px';
        l1.textContent = fit1.text;
        ctx.mark(l1,'text');
        labelBox.appendChild(l1);
        var l2 = el('div', null, 'height:'+subLh+'px;line-height:'+subLh+'px;font-size:'+subSize+'px;color:'+ctx.cc('muted')+';letter-spacing:0.3px;overflow:hidden;text-overflow:ellipsis;');
        var fit2 = ctx.fit(s.sub, subSize, labelW-4, null, 11, false);
        l2.style.fontSize = fit2.size+'px';
        l2.textContent = fit2.text;
        ctx.mark(l2,'text');
        labelBox.appendChild(l2);
        root.appendChild(labelBox);

        // value (right-aligned, to the right of bar area)
        var valX = w - marginX - valW;
        var valBox = el('div', null,
          'position:absolute;left:'+valX+'px;top:'+Math.round(stageCy[i]-valLh/2)+'px;width:'+valW+'px;height:'+valLh+'px;line-height:'+valLh+'px;text-align:right;font-family:var(--font);font-size:'+valSize+'px;font-variant-numeric:tabular-nums;color:'+ctx.cc('fg')+';font-weight:700;white-space:pre;');
        valBox.textContent = fmtNum(s.value);
        ctx.mark(valBox,'text');
        root.appendChild(valBox);
      });

      // Conversion % between stages (small pill)

        }
      }
      return pr;
    }
  });

        s.status.round.textContent = s.status.rTpl.replace('{n}', hop.round + 1);
        s.status.step.textContent = s.status.sTpl.replace('{label}', s.byId[nodeId].label);
        var visits = s.roundLen[hop.round];
        s.status.dots.forEach(function(d, k){
          d.setAttribute('fill', k <= kk2 ? s.status.accOn : s.status.off);
          d.setAttribute('opacity', k >= visits ? 0 : (k === kk2 ? 1 : (k < kk2 ? 0.45 : 0.9)));
        });
      }
    },

    events: function(lo, hi, ctx){
      var s = ctx && ctx.state;
      if(!s || !s.H || s.ambientOnly) return [];
      var out = [];
      var k0 = Math.floor(lo/s.T), k1 = Math.ceil(hi/s.T);
      var logc = (ctx.e.log && ctx.e.log.c) || 'acc1';
      var who = (ctx.e.log && ctx.e.log.who) || 'loop';
      for(var k = k0; k <= k1; k++){
        var hop = s.hops[((k % s.H) + s.H) % s.H];
        var from = s.byId[hop.from], to = s.byId[hop.to];
        out.push({t:k*s.T, who:who, c:logc, m:from.label + ' → ' + to.label, g:hop.E && hop.E.back ? 'loop' : ''});
      }
      return out;
    },

    check: function(ctx){
      var pr = [];
      var s = ctx.state;
      if(s && s.problems) pr = pr.concat(s.problems);
      var e = ctx.e;
      var mo = e.motion || 'ambient', apc = Number(e.ambientPeriod) || 3.0;
      if(mo.indexOf('walk') >= 0 && mo.indexOf('ambient') >= 0){
        var per = Number(e.period) || 26, qq = per/apc;
        if(Math.abs(qq - Math.round(qq)) > 1e-6) pr.push('period '+per+' is not a whole multiple of ambientPeriod '+apc);
      }
      // grid cells, spans included
      var seen = {};
      (e.nodes||[]).forEach(function(n){
        for(var c = 0; c < (n.span||1); c++){
          var k = (n.row||0) + ',' + ((n.col||0) + c);
          if(seen[k]) pr.push('nodes "'+seen[k]+'" and "'+n.id+'" share grid cell '+k);
          seen[k] = n.id;
        }
      });
      return pr;
    }
  });
})();

<script>/* view: ring.js */
/* ring view — loop / cycle diagram */
(function(){
  LP.registerView('ring', {
    build: function(ctx){
      var e = ctx.e, root = ctx.root, rect = ctx.rect;
      var w = rect.w, h = rect.h;
      var dark = ctx.dark;
      var period = e.period || 28;
      var steps = e.steps || [];
      var n = steps.length;
      if(n < 3) n = 3;
      var u = Math.min(w, h) / 100;
      var cx = w / 2, cy = h / 2;

      // ---- title area ----
      var titleH = 0, subH = 0;
      if(e.title){
        var titleSize = Math.round(u * 3.2);
        titleSize = Math.min(titleSize, 42);
        titleSize = Math.max(titleSize, 22);
        var tf = ctx.fit(e.title, titleSize, w * 0.8, 'var(--font-title)', 18, true);
        var titleEl = ctx.el('div');
        titleEl.style.cssText = 'position:absolute;left:0;top:' + Math.round(u*2) + 'px;width:' + w + 'px;text-align:center;font-family:var(--font-title);font-size:' + tf.size + 'px;line-height:' + Math.round(tf.size*1.3) + 'px;color:' + ctx.cc('fg') + ';font-weight:700;white-space:pre';
        titleEl.textContent = tf.text;
        ctx.mark(titleEl, 'text');
        root.appendChild(titleEl);
        titleH = Math.round(tf.size * 1.3) + u*2;
      }
      if(e.subtitle){
        var subSize = Math.round(u * 1.8);
        subSize = Math.min(subSize, 22);
        subSize = Math.max(subSize, 13);
        var sf = ctx.fit(e.subtitle, subSize, w * 0.7, null, 11);
        var subEl = ctx.el('div');
        subEl.style.cssText = 'position:absolute;left:0;top:' + Math.round(titleH + u*0.5) + 'px;width:' + w + 'px;text-align:center;font-size:' + sf.size + 'px;line-height:' + Math.round(sf.size*1.4) + 'px;color:' + ctx.cc('muted') + ';white-space:pre';
        subEl.textContent = sf.text;
        ctx.mark(subEl, 'text');
        root.appendChild(subEl);
        subH = Math.round(sf.size * 1.4);
      }
      var topPad = titleH + subH + u*2;

      // ---- layout ----
      var availH = h - topPad - u*2;
      var availW = w - u*4;
      var maxLab = 0;
      for(var q=0;q<steps.length;q++){
        var lw = ctx.measure(steps[q].label||'', Math.round(u*2.3), ctx.TH.titleFont, true);
        if(steps[q].desc) lw = Math.max(lw, ctx.measure(steps[q].desc, Math.round(u*1.6), null));
        maxLab = Math.max(maxLab, Math.min(lw, u*17));
      }
      var sideRoom = maxLab + u*2.8*1.25 + u*4.5;   // node radius + gap + label + margin
      var vRoom = u*2.8*1.25 + u*3 + Math.round(u*2.3)*1.25 + Math.round(u*1.6)*1.3 + u*1.5;
      var ringR = Math.min(availW/2 - sideRoom, availH/2 - vRoom);
      ringR = Math.max(ringR, u*18);
      cy = topPad + availH/2;

      // SVG
      var svg = ctx.svg('svg', {width: w, height: h});
      svg.style.cssText = 'position:absolute;left:0;top:0;overflow:visible;pointer-events:none';
      root.appendChild(svg);

      // outer ring track (static, faint)
      var track = ctx.svg('circle', {
        cx: cx, cy: cy, r: ringR,
        fill: 'none',
        stroke: ctx.cc('grid'),
        'stroke-width': dark ? 1.2 : 1.5
      });
      svg.appendChild(track);

      // step segments (arcs between steps)
      var stepAngle = 2 * Math.PI / n;
      // angles: step i is at angle = -PI/2 + i*stepAngle (start at top, go clockwise)
      function angleAt(i){ return -Math.PI/2 + i * stepAngle; }
      function ptOnRing(ang, r){
        return [cx + Math.cos(ang)*r, cy + Math.sin(ang)*r];
      }

      // arc path between step i and step i+1
      function arcPath(i){
        var a0 = angleAt(i) + stepAngle * 0.12;
        var a1 = angleAt((i+1)%n) - stepAngle * 0.12;
        var p0 = ptOnRing(a0, ringR);
        var p1 = ptOnRing(a1, ringR);
        var largeArc = (a1 - a0) > Math.PI ? 1 : 0;
        return 'M' + p0[0] + ',' + p0[1] + ' A' + ringR + ',' + ringR + ' 0 ' + largeArc + ' 1 ' + p1[0] + ',' + p1[1];
      }

      // arrow heads on arcs
      function arrowHead(i){
        var a = angleAt((i+1)%n) - stepAngle * 0.12;
        var tp = ptOnRing(a, ringR);
        var ap = ptOnRing(a - 0.15, ringR);
        var dx = tp[0]-ap[0], dy = tp[1]-ap[1];
        var L = Math.hypot(dx,dy)||1; dx/=L; dy/=L;
        var sz = u*1.2;
        var bx = tp[0]-dx*sz, by = tp[1]-dy*sz;
        return tp[0]+','+tp[1]+' '+(bx-dy*sz*0.5)+','+(by+dx*sz*0.5)+' '+(bx+dy*sz*0.5)+','+(by-dx*sz*0.5);
      }

      var arcPaths = [];
      var arrowHeads = [];
      for(var i=0;i<n;i++){
        var ap_ = ctx.svg('path', {
          d: arcPath(i),
          fill: 'none',
          stroke: ctx.cc('line2'),
          'stroke-width': dark ? 1.5 : 2,
          'stroke-linecap': 'round'
        });
        svg.appendChild(ap_);
        arcPaths.push(ap_);
        var ah = ctx.svg('polygon', {
          points: arrowHead(i),
          fill: ctx.cc('line2')
        });
        svg.appendChild(ah);
        arrowHeads.push(ah);
      }

      // step nodes + labels
      var nodeR = u * 2.8;
      var stepNodes = [];
      var stepLabels = [];
      var stepDescs = [];
      for(var i=0;i<n;i++){
        var a = angleAt(i);
        var p = ptOnRing(a, ringR);
        // node circle
        var nd = ctx.svg('circle', {
          cx: p[0], cy: p[1], r: nodeR,
          fill: ctx.cc('panel'),
          stroke: ctx.cc('line'),
          'stroke-width': 1.5
        });
        svg.appendChild(nd);
        // step number inside node
        var nt = ctx.svg('text', {
          x: p[0], y: p[1],
          'text-anchor': 'middle',
          'dominant-baseline': 'central',
          fill: ctx.cc('muted'),
          'font-size': Math.round(u*1.9),
          'font-family': 'var(--font)'
        });
        nt.textContent = String(i+1);
        svg.appendChild(nt);

        // label outside
        var labelR = ringR + nodeR + u*3;
        var lp = ptOnRing(a, labelR);
        var anchor = 'middle';
        var dx = 0;
        if(Math.cos(a) > 0.2){ anchor = 'start'; dx = u*1; }
        else if(Math.cos(a) < -0.2){ anchor = 'end'; dx = -u*1; }
        var lab = steps[i] ? steps[i].label : ('step '+(i+1));
        var labMaxW = u * 17;
        var labSize = Math.round(u*2.3);
        var lf = ctx.fit(lab, labSize, labMaxW, 'var(--font-title)', 11, true);
        var hasDesc = !!(steps[i] && steps[i].desc);
        var dSz = Math.round(u*1.6);
        var gapY = lf.size*0.62 + dSz*0.62 + u*0.45;
        var isTop = Math.sin(a) < -0.5;
        var labY = (hasDesc && isTop) ? lp[1] - gapY : lp[1];
        var descY = (hasDesc && isTop) ? lp[1] : lp[1] + gapY;
        var lt = ctx.svg('text', {
          x: lp[0]+dx, y: labY,
          'text-anchor': anchor,
          'dominant-baseline': 'central',
          fill: ctx.cc('fg'),
          'font-size': lf.size,
          'font-family': 'var(--font-title)',
          'font-weight': '700'
        });
        lt.textContent = lf.text;
        svg.appendChild(lt);
        ctx.mark(lt, 'text');

        // description below label
        if(steps[i] && steps[i].desc){
          var descMaxW = u * 17;
          var descSize = Math.round(u*1.6);
          var df = ctx.fit(steps[i].desc, descSize, descMaxW, null, 11);
          var dt = ctx.svg('text', {
            x: lp[0]+dx, y: descY,
            'text-anchor': anchor,
            'dominant-baseline': 'central',
            fill: ctx.cc('muted'),
            'font-size': df.size,
            'font-family': 'var(--font)'
          });
          dt.textContent = df.text;
          svg.appendChild(dt);
          ctx.mark(dt, 'text');
          stepDescs.push({el: dt, y: descY});
        }

        stepNodes.push({circle: nd, num: nt, x: p[0], y: p[1], a: a});
        stepLabels.push({el: lt, x: lp[0]+dx, y: lp[1]});
      }

      // comet (glowing dot + tail)
      var cometR = u * 1.9;
      var comet = ctx.svg('circle', {
        cx: 0, cy: 0, r: cometR,
        fill: ctx.cc('acc1'),
        stroke: 'none'
      });
      svg.appendChild(comet);

      // comet glow
      var glow = ctx.svg('circle', {
        cx: 0, cy: 0, r: cometR * 3,
        fill: ctx.cc('acc1'),
        opacity: dark ? 0.25 : 0.18
      });
      svg.appendChild(glow);

      // inner sub-loop (optional spokes / inner cycle)
      var innerR = ringR * 0.45;
      var innerCircle = null;
      var innerLabel = null;
      var innerIter = null;
      if(e.innerLoop){
        innerCircle = ctx.svg('circle', {
          cx: cx, cy: cy, r: innerR,
          fill: dark ? ctx.cc('panel') : ctx.cc('accf1'),
          stroke: ctx.cc('line2'),
          'stroke-width': dark ? 1 : 1.2,
          opacity: 0.7
        });
        svg.appendChild(innerCircle);
        ctx.mark(innerCircle, 'frame');
      }
      var innerItems = [];
      var innerList = Array.isArray(e.innerLoop) ? e.innerLoop : [];
      for(var k=0;k<innerList.length;k++){
        var ia = -Math.PI/2 + k * 2*Math.PI/innerList.length;
        var ip = ptOnRing(ia, innerR*1.22);
        var itf = ctx.fit(innerList[k], Math.round(u*1.5), u*10, null, 11);
        var it = ctx.svg('text', {x: ip[0], y: ip[1], 'text-anchor':'middle', 'dominant-baseline':'central',
          fill: ctx.cc('muted'), 'font-size': itf.size, 'font-family':'var(--font)'});
        it.textContent = itf.text; svg.appendChild(it); ctx.mark(it, 'text'); innerItems.push(it);
      }

      // center text: loop name + iteration
      var loopName = e.name || e.title || 'Loop';
      var nf = ctx.fit(loopName, Math.round(u*2.2), innerR*1.6, 'var(--font-title)', 11, true);
      var centerName = ctx.svg('text', {
        x: cx, y: cy - u*1.5,
        'text-anchor': 'middle',
        'dominant-baseline': 'central',
        fill: ctx.cc('fg'),
        'font-size': nf.size,
        'font-family': 'var(--font-title)',
        'font-weight': '700'
      });
      centerName.textContent = nf.text;
      svg.appendChild(centerName);
      ctx.mark(centerName, 'text');

      var iterLabel = ctx.svg('text', {
        x: cx, y: cy + u*1.5,
        'text-anchor': 'middle',
        'dominant-baseline': 'central',
        fill: ctx.cc('fg'),
        'font-size': Math.round(u*2.8),
        'font-family': 'var(--font-title)',
        'font-weight': '700',
        'font-variant-numeric': 'tabular-nums'
      });
      iterLabel.textContent = '#1';
      svg.appendChild(iterLabel);
      ctx.mark(iterLabel, 'text');

      var iterSub = ctx.svg('text', {
        x: cx, y: cy + u*4.2,
        'text-anchor': 'middle',
        'dominant-baseline': 'central',
        fill: ctx.cc('muted'),
        'font-size': Math.round(u*1.5),
        'font-family': 'var(--font)'
      });
      iterSub.textContent = 'iteration';
      svg.appendChild(iterSub);
      ctx.mark(iterSub, 'text');

      // ---- state for seek ----
      var _st = {
        cx:cx, cy:cy, ringR:ringR, n:n, stepAngle:stepAngle, period:period,
        comet:comet, glow:glow, iterLabel:iterLabel,
        stepNodes:stepNodes, arcPaths:arcPaths, arrowHeads:arrowHeads,
        innerCircle:innerCircle, nodeR:nodeR, u:u, dark:dark, innerItems:innerItems, innerStep:(e.innerLoopStep==null?1:e.innerLoopStep),
        accentIdx: 0
      };
      return _st;
    },

    seek: function(t, ctx, st){
      var s = st || (ctx && ctx.state);
      if(!s) return;
      var cx = s.cx, cy = s.cy, ringR = s.ringR, n = s.n;
      var stepAngle = s.stepAngle, period = s.period;

      // single truth: comet angle (full circle per period)
      var uT = (t / period); // normalized 0..1 per lap
      var lap = Math.floor(uT);
      var phase = uT - lap; // 0..1 within current lap
      var angle = -Math.PI/2 + phase * 2 * Math.PI;

      // comet position
      var cxp = cx + Math.cos(angle)*ringR;
      var cyp = cy + Math.sin(angle)*ringR;
      s.comet.setAttribute('cx', cxp);
      s.comet.setAttribute('cy', cyp);
      s.glow.setAttribute('cx', cxp);
      s.glow.setAttribute('cy', cyp);

      // iteration counter (pad to keep width stable)
      var iterNum = lap + 1;
      var iterStr = '#' + iterNum;
      if(s.iterLabel.textContent !== iterStr){
        s.iterLabel.textContent = iterStr;
      }

      // current step = floor(phase * n)
      var curStep = Math.floor(phase * n);
      if(curStep >= n) curStep = n-1;

      // highlight current step (slow tempo: the step changes every period/n seconds)
      var stepPhase = (phase * n) - curStep; // 0..1 within current step

      for(var i=0;i<n;i++){
        var node = s.stepNodes[i];
        var ap = s.arcPaths[i];
        var ah = s.arrowHeads[i];
        var isCur = (i === curStep);
        var isNext = (i === (curStep+1)%n);
        // arc leading to curStep: accented
        if(isCur){
          // arc i runs from step i to step i+1: the one the comet is travelling along
          ap.setAttribute('stroke', ctx.cc(ctx.acc(s.accentIdx)));
          ap.setAttribute('stroke-width', s.dark ? 2.5 : 3);
          ap.setAttribute('opacity', '1');
          ah.setAttribute('fill', ctx.cc(ctx.acc(s.accentIdx)));
        } else if(isNext && stepPhase > 0.7){
          // approaching next step
          var k = (stepPhase - 0.7)/0.3;
          ap.setAttribute('stroke', ctx.cc(ctx.acc(s.accentIdx)));
          ap.setAttribute('stroke-width', s.dark ? 1.5 + k : 2 + k);
          ap.setAttribute('opacity', String(0.4 + 0.6*k));
          ah.setAttribute('fill', ctx.cc(ctx.acc(s.accentIdx)));
        } else {
          ap.setAttribute('stroke', ctx.cc('line2'));
          ap.setAttribute('stroke-width', s.dark ? 1.5 : 2);
          ap.setAttribute('opacity', s.dark ? '0.5' : '0.7');
          ah.setAttribute('fill', ctx.cc('line2'));
        }

        // node highlight
        if(isCur){
          node.circle.setAttribute('fill', ctx.cc(ctx.accf(s.accentIdx)));
          node.circle.setAttribute('stroke', ctx.cc(ctx.acc(s.accentIdx)));
          node.circle.setAttribute('stroke-width', '2.5');
          node.circle.setAttribute('r', String(s.nodeR * 1.25));
          node.num.setAttribute('fill', ctx.cc(ctx.acc(s.accentIdx)));
          node.num.setAttribute('font-weight', '700');
        } else {
          node.circle.setAttribute('fill', ctx.cc('panel'));
          node.circle.setAttribute('stroke', ctx.cc('line'));
          node.circle.setAttribute('stroke-width', '1.5');
          node.circle.setAttribute('r', String(s.nodeR));
          node.num.setAttribute('fill', ctx.cc('muted'));
          node.num.setAttribute('font-weight', '400');
        }
      }

      // inner sub-loop: medium tempo, one item lit per 1.2 s, only while its parent step runs
      if(s.innerItems.length){
        var on = (curStep === s.innerStep);
        var lit = Math.floor(t / 1.2) % s.innerItems.length;
        for(var j=0;j<s.innerItems.length;j++){
          var hot = on && j === lit;
          s.innerItems[j].setAttribute('fill', hot ? ctx.cc('fg') : ctx.cc('muted'));
          s.innerItems[j].setAttribute('font-weight', hot ? '700' : '400');
        }
      }
      // comet pulsing (fast tempo)
      // pulse frequency is a whole number of cycles per lap, so the loop has no jump
      var pulseK = Math.max(1, Math.round(6*period/(2*Math.PI)));
      var pulse = 1 + 0.15 * Math.sin(2*Math.PI*pulseK*t/period);
      s.comet.setAttribute('r', String(s.u*1.9 * pulse));
    },

    check: function(ctx){
      var e = ctx.e;
      var msgs = [];
      if(!e.steps || !e.steps.length) msgs.push('ring: steps is required (3-8 items)');
      else if(e.steps.length < 3 || e.steps.length > 8) msgs.push('ring: steps must have 3-8 items');
      return msgs;
    }
  });
})();

</script>
<script>
(function(){
'use strict';
var mod=function(a,n){return ((a%n)+n)%n};
var esc=function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')};
// deterministic "random": a pure hash of (seed, index). Never Math.random, never the wall clock.
function hash(seed,k){var h=Math.imul((seed|0)+0x9e3779b9,0x85ebca6b)^Math.imul(k|0,0xc2b2ae35);h=Math.imul(h^(h>>>16),0x7feb352d);h=Math.imul(h^(h>>>15),0x846ca68b);return ((h^(h>>>16))>>>0)/4294967296}

var cfg=null, ST=document.getElementById('stage'), V={}, DYN=[], PK=[], EVT=[], MACH=[], CHK=[];
var CW=1200, CH=1500, LH=30, PRE=0, FS=21;
window.__ready=false; window.__pending=null;

function fail(e){var d=document.getElementById('err')||document.body.appendChild(Object.assign(document.createElement('div'),{id:'err'}));d.textContent+=String(e&&e.stack||e)+'\n';window.__error=(window.__error||'')+String(e)+'\n'}

function loadConfig(){
  var el=document.getElementById('live-config');
  if(el&&el.textContent.trim()) return Promise.resolve(JSON.parse(el.textContent));
  var m=/[?&]config=([^&]+)/.exec(location.search);
  if(m) return fetch(decodeURIComponent(m[1])).then(function(r){return r.json()});
  return Promise.reject(new Error('no config: embed <script id="live-config" type="application/json"> or use ?config=path.json (over http)'));
}

// ---------- value access / templating ----------
function tv(k){var v=V[k]; if(v==null) return ''; return typeof v==='object'?v.text:String(v)}
function fill(s,sc){return String(s).replace(/\{([\w.\-]+)\}/g,function(m,k){var v=sc?sc(k):null; if(v==null) v=V[k]; if(v==null) return m; return typeof v==='object'?v.text:String(v)})}
function cond(w){if(!w) return true; if(Array.isArray(w)) return w.every(cond); var v=tv(w['var']); if('eq' in w) return v===String(w.eq); if('ne' in w) return v!==String(w.ne); if('in' in w) return w['in'].map(String).indexOf(v)>=0; return !!v}
function cc(n){return n?'var(--c-'+n+')':''}
function fmtNum(n,f){n=Math.floor(n); return f==='comma'?String(n).replace(/\B(?=(\d{3})+(?!\d))/g,','):String(n)}

// ---------- runs / lines ----------
function runHtml(r){
  if(typeof r==='string') r={t:r};
  var c=r.c,b=r.b,sty='';
  if(r.when&&r.then&&cond(r.when)){ if(r.then.c) c=r.then.c; if(r.then.b!=null) b=r.then.b; }
  if(r.cursor){ var on=mod(V.__t,r.period||1.1)<(r.on||0.6); return '<span class="cur" style="background:'+cc(c||'gr')+';opacity:'+(on?1:0)+'"></span>'; }
  if(r.sw) return '<i class="sw" style="background:'+cc(r.sw)+'"></i>';
  var txt;
  if(r.v){ var v=V[r.v]; if(v==null) v=''; if(typeof v==='object'){ txt=v.text; if(!c&&v.c) c=v.c; if(b==null&&v.b!=null) b=v.b; } else txt=String(v); }
  else txt=fill(r.t==null?'':r.t);
  if(c) sty+='color:'+cc(c)+';';
  if(b) sty+='font-weight:700;';
  if(r.size) sty+='font-size:'+r.size+'px;';
  return sty?'<span style="'+sty+'">'+esc(txt)+'</span>':esc(txt);
}
function runsHtml(rs){return (rs||[]).map(runHtml).join('')}
function barHtml(b){
  var segs, mark=b.mark, w=b.w||127, h=b.h||20;
  if(b.gauge){ var n=V[b.gauge+'.num'], low=V[b.gauge+'.low']==='1', c=low?(b.low||'cy'):(b.high||'gr');
    segs=[{from:0,to:n,c:c,end:true}]; }

function clockStr(t){var p=LOG.clock.start.split(':').map(Number), s=Math.floor(p[0]*3600+p[1]*60+p[2]+t*LOG.clock.rate); s=mod(s,86400); var z=function(n){return (n<10?'0':'')+n}; return z(Math.floor(s/3600))+':'+z(Math.floor(s/60)%60)+':'+z(s%60)}

    var sig=0;
    PK.forEach(function(P){ if(P.when&&!cond(P.when)){ P.el.forEach(function(q){q[0].style.display='none';q[1].style.display='none'}); return; } P.o.forEach(function(o,n){ var u=(t+PRE+o)/P.period, d=(u-Math.floor(u))*P.len; sig+=Math.floor(u); putPk(P.el[n][0],P,d); putPk(P.el[n][1],P,d-P.tail); }); });

      if(on){ var ph=Number(V[A.m+'.phase']), u=ph/0.9, d=(u-Math.floor(u))*(A.P.len+10); putPk(A.P.el[0],A.P,d); putPk(A.P.el[1],A.P,d-12); }

// ---------- layout self-check (used by scripts/check_frames.py) ----------
window.__check=function(){

  // 1 text inside canvas
  items.forEach(function(a){ if(a.l<-0.5||a.t<-0.5||a.r>CW+0.5||a.b>CH+0.5) prob.push('outside canvas: "'+a.txt+'"'); });

};
