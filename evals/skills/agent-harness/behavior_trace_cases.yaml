      { "type": "closeout", "target": "host-direct-postflight", "fields": { "durable_gates_applied": false, "lifecycle_created": false } }
    ],
    "assertions": {
      "required_ordered_reads": ["harness/tasks.md"],
      "required_ordered_events": [{ "type": "verification", "target": "fresh postflight verification" }, { "type": "write", "target": "harness/tasks.md" }, { "type": "closeout", "target": "host-direct-postflight" }],
      "required_event_fields": [{ "type": "closeout", "target": "host-direct-postflight", "fields": { "durable_gates_applied": false, "lifecycle_created": false } }],
      "forbidden_writes": ["harness/goals/**", ".harness/runs/**"],
      "forbidden_mutations": ["goal-create", "run-prepare", "gate-create"]
    }
  },
